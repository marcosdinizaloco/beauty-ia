<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beauty IA</title>
<meta name="description" content="Beauty IA: selecione seu país e conheça a assistente do seu salão.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  --preto:#120208; --azul:#FF4F8B; --azul2:#FFB8CF; --giz:#FFF1F6; --giz2:#D7A8BC;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
html{background:var(--preto)}
body{margin:0;background:var(--preto);color:var(--giz);font-family:var(--texto);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--azul2);outline-offset:4px;border-radius:12px}

.capa{position:relative;min-height:100svh;display:grid;place-items:center;padding:28px 20px 40px;overflow:clip;isolation:isolate;perspective:1200px}
.camada{position:absolute;inset:-6%;z-index:-3;background-size:cover;background-position:center;will-change:transform}
.fundo{animation:respirar 24s ease-in-out infinite alternate}
@keyframes respirar{from{transform:scale(1.04)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
.brilho{position:absolute;z-index:-2;inset:0;background:
  radial-gradient(60% 50% at 72% 45%,rgba(255,79,139,.32),transparent 70%),
  radial-gradient(45% 40% at 18% 70%,rgba(255,79,139,.14),transparent 72%);
  animation:pulsar 6s ease-in-out infinite}
@keyframes pulsar{0%,100%{opacity:.75}50%{opacity:1}}
.vinheta{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 35%,rgba(18,2,8,.85) 100%),linear-gradient(180deg,rgba(18,2,8,.55),transparent 28%,rgba(18,2,8,.9))}
.poeira{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55}
.raio{position:absolute;top:-30%;left:-20%;width:45%;height:170%;z-index:-2;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,184,207,.16) 45%,transparent);filter:blur(22px);transform:rotate(12deg);animation:varrer 9s ease-in-out infinite}
@keyframes varrer{0%{transform:translateX(-30%) rotate(12deg)}55%,100%{transform:translateX(230%) rotate(12deg)}}

/* O mesmo robo aparece duas vezes agora: aqui na cena e dentro do selo.
   Dois personagens apontando pra frente brigam entre si, entao este
   recua de vez — vira o lugar, nao o assunto. */
.robo{position:absolute;right:-4%;bottom:0;height:min(96%,860px);z-index:-2;pointer-events:none;opacity:.4;
  filter:drop-shadow(0 30px 70px rgba(0,0,0,.6)) blur(1.4px) saturate(.85);
  animation:flutuar 7s ease-in-out infinite;will-change:transform}
.robo img{height:100%;width:auto;display:block}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

.centro{position:relative;width:min(1120px,100%);display:grid;justify-items:center;text-align:center;gap:22px}
.logo{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:5px;color:var(--azul2);opacity:.9}
/* O SELO
   A marca virou Barber IA Pro, e quem diz isso agora e a propria logo.
   Sairam a tesoura solta e o "BARBER IA" escrito: os dois repetiam, em
   qualidade pior, o que ja esta desenhado dentro do selo.
   Continua sendo <h1>: para o Google e para leitor de tela o titulo da
   pagina nao sumiu — ele so deixou de ser texto na tela. */
.selo{margin:0;width:clamp(168px,29svh,300px);position:relative;
  animation:selo-entra 1.05s cubic-bezier(.2,.9,.2,1) both}
.selo img{width:100%;height:auto;aspect-ratio:1;display:block;
  filter:drop-shadow(0 0 58px rgba(255,79,139,.5)) drop-shadow(0 26px 54px rgba(0,0,0,.8))}
/* o halo respira devagar: da vida sem roubar o olho do que importa,
   que e a escolha do pais logo abaixo */
.selo:before{content:"";position:absolute;inset:-16%;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,79,139,.42),transparent 62%);filter:blur(16px);
  animation:selo-halo 4.6s ease-in-out infinite}
@keyframes selo-entra{from{opacity:0;transform:translateY(28px) scale(.85)}to{opacity:1;transform:none}}
@keyframes selo-halo{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
@keyframes brilhar{0%,100%{opacity:.6;transform:scaleX(.85)}50%{opacity:1;transform:scaleX(1)}}
@keyframes surgir{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
/* A frase de posicionamento. Entra entre o selo e a pergunta: diz o que
   e isto antes de pedir uma escolha. Discreta de proposito — quem decide
   a tela e o selo em cima e as bandeiras embaixo. */
/* O NOME DA MARCA
   No barber o nome vem desenhado dentro do selo. Aqui o selo e a propria
   mascote recortada, entao o nome e texto de verdade: fica nitido em
   qualquer tela, da pra ler por leitor de tela, e muda sem refazer imagem. */
.marca{display:flex;align-items:baseline;justify-content:center;gap:.14em;
  margin-top:clamp(10px,1.6svh,18px);
  font-family:var(--display);font-weight:700;line-height:1;
  font-size:clamp(28px,5.4svh,52px);letter-spacing:.5px;color:var(--giz);
  text-shadow:0 0 34px rgba(255,79,139,.45),0 10px 30px rgba(0,0,0,.75)}
.marca em{font-style:normal;color:var(--azul)}
.marca i{font-style:normal;font-family:var(--texto);font-weight:700;
  font-size:.34em;letter-spacing:3px;color:var(--giz);
  padding:.28em .5em;border-radius:999px;align-self:center;
  background:linear-gradient(180deg,rgba(255,79,139,.95),rgba(224,48,111,.95));
  box-shadow:0 4px 14px rgba(255,79,139,.4)}
@media (max-width:820px){ .marca{font-size:clamp(24px,4.6svh,38px);margin-top:8px} }
.lema{margin:0;font-family:var(--display);font-weight:700;letter-spacing:4px;text-transform:uppercase;
  font-size:clamp(11px,1.5vw,15px);color:var(--azul2);opacity:.92;
  animation:surgir 1s .12s cubic-bezier(.2,.9,.2,1) both}
.chamada{margin:0;display:grid;gap:4px;animation:surgir 1s .2s cubic-bezier(.2,.9,.2,1) both}
.chamada b{font-family:var(--display);font-weight:800;font-size:clamp(15px,2.3vw,20px);letter-spacing:6px;text-transform:uppercase}
.chamada i{font-style:normal;font-size:clamp(13px,2vw,17px);letter-spacing:5px;text-transform:uppercase;color:var(--azul2)}

.paises{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3vw,34px);margin-top:6px;list-style:none;padding:0;transform-style:preserve-3d}
.pais{animation:surgir .9s cubic-bezier(.2,.9,.2,1) both}
.pais:nth-child(1){animation-delay:.35s}.pais:nth-child(2){animation-delay:.45s}.pais:nth-child(3){animation-delay:.55s}.pais:nth-child(4){animation-delay:.65s}
.pais a,.pais .caixa{display:grid;justify-items:center;gap:12px;padding:14px;border-radius:22px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pais a:hover,.pais a:focus-visible{transform:translateY(-10px) scale(1.04)}
.bandeira{position:relative;width:clamp(96px,10vw,140px);aspect-ratio:4/3;border-radius:10px;background:#fff;overflow:hidden;
  border:2px solid rgba(255,184,207,.55);box-shadow:0 0 0 1px rgba(18,2,8,.9),0 18px 40px -14px rgba(0,0,0,.8),0 0 26px rgba(255,79,139,.35);
  transition:box-shadow .3s,border-color .3s}
.bandeira img{width:100%;height:100%;object-fit:cover;display:block}
.bandeira:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .7s}
.pais a:hover .bandeira{border-color:#BFE4FF;box-shadow:0 0 0 1px rgba(18,2,8,.9),0 24px 50px -14px rgba(0,0,0,.85),0 0 46px rgba(255,79,139,.8)}
.pais a:hover .bandeira:after{transform:translateX(120%)}
.nome{font-family:var(--display);font-weight:900;font-size:clamp(15px,2.2vw,22px);letter-spacing:3px;text-transform:uppercase}
.nome:after{content:"";display:block;width:46px;height:3px;margin:8px auto 0;border-radius:3px;background:var(--azul);box-shadow:0 0 14px rgba(255,79,139,.9)}
.em-breve .caixa{cursor:default}
.em-breve .bandeira{filter:grayscale(.35) brightness(.8);border-color:rgba(255,184,207,.25);box-shadow:0 0 0 1px rgba(18,2,8,.9),0 18px 40px -14px rgba(0,0,0,.8)}
.em-breve .nome{opacity:.75}.em-breve .nome:after{background:var(--giz2,#8a94a6);box-shadow:none}
.breve{margin-top:-4px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#BFE4FF;padding:4px 10px;border:1px solid rgba(255,184,207,.45);border-radius:999px;background:rgba(255,79,139,.12);white-space:nowrap}
.rodape{margin-top:10px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--giz2);animation:surgir 1s .7s both}

@media (min-width:1000px){
  .capa{place-items:center start;padding-left:clamp(28px,6vw,90px)}
  .centro{width:min(660px,56%)}
  .paises{flex-wrap:nowrap}
  .robo{right:-3%;height:min(98%,900px)}
}
@media (max-width:820px){
  /* celular: tela cheia, tudo centralizado */
  /* CELULAR

     Quatro bandeiras lado a lado numa tela de 360px davam 80px cada,
     com o nome do pais espremido embaixo e alvo de toque menor do que a
     ponta do dedo. Viraram grade de duas colunas: cada pais ganha o
     dobro da largura e um cartao de verdade pra tocar.

     A tela e de ESCOLHA. Entao tudo serve a escolha: o selo encolhe, o
     robo do fundo apaga, e o que fica forte sao os quatro cartoes. */
  .capa{place-items:center;padding:clamp(20px,5svh,36px) 18px calc(clamp(20px,5svh,36px) + env(safe-area-inset-bottom,0px))}
  /* A FAIXA PRETA DO TOPO
     No celular a cena e vertical: o brilho estava no meio da tela e a
     vinheta escurecia os 28% de cima. Resultado: uma tarja preta entre a
     barra do Safari e o selo. O brilho sobe pra tras do selo e a vinheta
     de cima quase some — o azul agora comeca na primeira linha. */
  .camada{background-position:50% 32%}
  .brilho{background:
    radial-gradient(78% 42% at 50% 26%,rgba(255,79,139,.34),transparent 72%),
    radial-gradient(60% 36% at 50% 62%,rgba(255,79,139,.13),transparent 75%)}
  .vinheta{background:
    radial-gradient(130% 85% at 50% 32%,transparent 40%,rgba(18,2,8,.8) 100%),
    linear-gradient(180deg,rgba(18,2,8,.12),transparent 14%,rgba(18,2,8,.88))}
  .centro{width:min(100%,430px);margin:0;gap:clamp(12px,2.6svh,22px)}

  /* o mesmo robo ja esta dentro do selo; aqui atras ele e so atmosfera */
  /* No barber a mascote recua no celular porque o robo ja aparece dentro
     do selo, e dois personagens apontando brigam entre si. Aqui o selo e
     o rosto dela em close: a figura inteira ao lado nao repete, completa.
     Entao ela fica visivel — presente, sem disputar com os cartoes. */
  .robo{right:-14%;transform:none;top:auto;bottom:0;height:min(56svh,500px);opacity:.42;
    filter:blur(.8px) saturate(.95);
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 16%);mask-image:linear-gradient(to bottom,transparent,#000 16%)}

  .selo{width:clamp(96px,16svh,140px)}          /* ~25% menor que antes */
  .lema{font-size:clamp(10px,3vw,12px);letter-spacing:2.5px}
  .chamada b{font-size:clamp(14px,4.4vw,18px);letter-spacing:3px}
  .chamada i{font-size:clamp(11px,3.4vw,14px);letter-spacing:3px}

  /* grade 2x2 — Brasil e Mexico em cima, Espanha e Portugal embaixo */
  .paises{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:4px}
  .pais{min-width:0}
  /* align-content:center — o cartao de Portugal e mais alto por causa do
     "em breve", e a grade iguala a altura dos quatro. Sem isto, o
     conteudo da Espanha encosta no topo e sobra um buraco embaixo. */
  .pais a,.pais .caixa{width:100%;height:100%;padding:12px 10px 14px;gap:10px;align-content:center;
    border-radius:18px;background:linear-gradient(170deg,rgba(44,12,26,.72),rgba(26,6,14,.72));
    border:1px solid rgba(255,184,207,.22);
    box-shadow:0 10px 26px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,214,228,.06)}
  .pais a{min-height:112px}
  .pais a:active{transform:scale(.97)}
  .bandeira{width:min(100%,104px)}
  .nome{font-size:clamp(12px,3.6vw,15px);letter-spacing:1px;white-space:nowrap}
  .nome:after{width:30px;margin-top:6px}

  .em-breve .caixa{background:linear-gradient(170deg,rgba(32,8,18,.6),rgba(26,6,14,.6));
    border-color:rgba(255,184,207,.12)}
  .breve{font-size:10px;letter-spacing:1px;padding:3px 9px;margin-top:0}

  .rodape{display:none}

  /* o botao de som nao disputa com a escolha: sem fundo, so o contorno */
  .som{top:calc(10px + env(safe-area-inset-top,0px));right:10px;padding:7px 12px;font-size:10.5px;gap:6px;
    background:transparent;border-color:rgba(255,184,207,.22);opacity:.6}
}


.som{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:60;display:inline-flex;align-items:center;gap:9px;
  background:rgba(18,2,8,.6);border:1px solid rgba(255,184,207,.45);color:var(--giz);border-radius:999px;padding:10px 16px 10px 13px;
  font:700 12px var(--texto);letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s,transform .2s}
.som:hover{border-color:#BFE4FF;transform:translateY(-1px)}
.som[aria-pressed="true"]{border-color:rgba(255,184,207,.9);box-shadow:0 0 18px rgba(255,79,139,.45)}
.som .on{display:none}
.som[aria-pressed="true"] .on{display:inline}
.som[aria-pressed="true"] .off{display:none}
.equal{display:flex;align-items:flex-end;gap:2px;height:14px}
.equal i{width:3px;background:var(--azul2);border-radius:2px;height:30%}
.som[aria-pressed="true"] .equal i{animation:eq .8s ease-in-out infinite alternate}
.som[aria-pressed="true"] .equal i:nth-child(2){animation-duration:.55s}
.som[aria-pressed="true"] .equal i:nth-child(3){animation-duration:1.05s}
@keyframes eq{from{height:22%}to{height:100%}}
@media (max-width:560px){.som{padding:7px 11px;font-size:10px;gap:6px}}
/* 320px: o cartao aperta, entao a bandeira cede primeiro */
@media (max-width:359px){
  .centro{gap:10px}
  .selo{width:clamp(104px,18svh,152px)}
  .paises{gap:9px}
  .pais a,.pais .caixa{padding:10px 7px 12px;gap:8px;border-radius:15px}
  .pais a{min-height:100px}
  .bandeira{width:min(100%,86px)}
  .nome{font-size:12px;letter-spacing:.5px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

// música de fundo (deep house): entra no primeiro toque, porque o navegador bloqueia som automático
(function(){
  const au = document.getElementById("trilha"), bt = document.getElementById("som");
  if (!au || !bt) return;
  const VOL = .32;
  let ligado = false, jaTentou = false;
  au.volume = 0;
  function fade(para, ms){
    const de = au.volume, t0 = performance.now();
    (function passo(t){
      const k = Math.min(1, (t - t0) / ms);
      au.volume = Math.max(0, Math.min(1, de + (para - de) * k));
      if (k < 1) requestAnimationFrame(passo);
    })(t0);
  }
  function liga(){
    au.play().then(() => { ligado = true; bt.setAttribute("aria-pressed", "true"); fade(VOL, 1800); }).catch(() => {});
  }
  function desliga(){
    ligado = false; bt.setAttribute("aria-pressed", "false"); fade(0, 400);
    setTimeout(() => { if (!ligado) au.pause(); }, 450);
  }
  bt.addEventListener("click", e => { e.stopPropagation(); ligado ? desliga() : liga(); });
  // tenta já tocar ao abrir; se o navegador bloquear, entra no primeiro toque
  liga();
  const solta = e => {
    if (jaTentou || ligado) return;
    if (e && e.target && e.target.closest && e.target.closest(".som")) return;
    jaTentou = true; liga();
  };
  ["pointerdown", "keydown", "touchstart", "scroll"].forEach(ev => addEventListener(ev, solta, { passive: true }));
  document.addEventListener("visibilitychange", () => {
    if (!ligado) return;
    document.hidden ? au.pause() : au.play().catch(() => {});
  });
})();

// poeira / partículas flutuando
(function(){
  const c = document.getElementById("poeira"), x = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let p = [], w, h;
  function tam(){ w = c.width = c.offsetWidth; h = c.height = c.offsetHeight;
    p = Array.from({length: Math.min(90, Math.round(w / 14))}, () => ({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.8 + .4,
      v: Math.random()*.25 + .05, o: Math.random()*.5 + .2, f: Math.random()*6.28 })); }
  function passo(t){
    x.clearRect(0,0,w,h);
    for (const d of p){
      d.y -= d.v; d.f += .01;
      if (d.y < -6){ d.y = h + 6; d.x = Math.random()*w; }
      const dx = d.x + Math.sin(d.f)*14;
      x.beginPath(); x.arc(dx, d.y, d.r, 0, 6.3);
      x.fillStyle = "rgba(160,205,255," + (d.o * (.6 + .4*Math.sin(d.f*1.7))) + ")"; x.fill();
    }
    requestAnimationFrame(passo);
  }
  tam(); addEventListener("resize", tam); requestAnimationFrame(passo);
})();

// parallax: fundo, robô e cartões reagem ao mouse / giro do celular
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const fundo = document.getElementById("fundo"), robo = document.getElementById("robo"), centro = document.querySelector(".centro");
  let ax = 0, ay = 0, cx = 0, cy = 0;
  function loop(){
    cx += (ax - cx) * .06; cy += (ay - cy) * .06;
    fundo.style.translate = `${cx*-18}px ${cy*-12}px`;
    robo.style.translate = `${cx*34}px ${cy*18}px`;
    centro.style.transform = `rotateY(${cx*5}deg) rotateX(${cy*-4}deg) translate3d(${cx*14}px,${cy*8}px,0)`;
    requestAnimationFrame(loop);
  }
  addEventListener("mousemove", e => { ax = e.clientX/innerWidth - .5; ay = e.clientY/innerHeight - .5; });
  addEventListener("deviceorientation", e => {
    if (e.gamma == null) return;
    ax = Math.max(-.5, Math.min(.5, e.gamma/45)); ay = Math.max(-.5, Math.min(.5, (e.beta-45)/45));
  });
  requestAnimationFrame(loop);
})();
